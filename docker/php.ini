; Magento 2.4.8 local settings. Apache overrides memory_limit to 2G (magento-php.conf);
; the CLI keeps -1 because composer install and setup:di:compile need more than 2G.
memory_limit = -1
max_execution_time = 1800
max_input_vars = 10000
upload_max_filesize = 64M
post_max_size = 64M
realpath_cache_size = 10M
realpath_cache_ttl = 7200
zlib.output_compression = Off
date.timezone = UTC

; Code under app/code/Skydropx/Shipping is bind-mounted in dev: always revalidate.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 100000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
